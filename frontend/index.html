<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResumeCraft | Resume Builder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <h1>ResumeCraft</h1>
    <p>Build your professional resume in minutes</p>
</header>

<main class="container">

    <section class="form-section">
        <h2>Create Your Resume</h2>
        <form id="resumeForm">

            <h3>Personal Information</h3>
            <input id="name" placeholder="Full Name" required>
            <input id="email" type="email" placeholder="Email Address" required>
            <input id="phone" placeholder="Phone Number">
            <input id="location" placeholder="Location">
            <textarea id="summary" placeholder="Professional Summary"></textarea>

            <h3>Education</h3>
            <div id="educationFields">
                <div class="dynamic-item">
                    <input class="degree" placeholder="Degree">
                    <input class="institution" placeholder="College / Institution">
                    <input class="status" placeholder="Status (Pursuing / Completed)">
                </div>
            </div>
            <button type="button" class="secondary" id="addEducation">+ Add Education</button>

            <h3>Work Experience</h3>
            <div id="experienceFields">
                <div class="dynamic-item">
                    <input class="company" placeholder="Company">
                    <input class="role" placeholder="Job Role">
                    <input class="duration" placeholder="Duration">
                    <textarea class="description" placeholder="Work Description"></textarea>
                </div>
            </div>
            <button type="button" class="secondary" id="addExperience">+ Add Experience</button>

            <h3>Skills</h3>
            <textarea id="skills" placeholder="Enter skills separated by commas"></textarea>

            <button type="submit" class="primary">Save & Generate Resume</button>
        </form>
    </section>

    <section class="preview-section">
        <h2>Resume Preview</h2>
        <div id="resumePreview">
            <p>Your resume preview will appear here.</p>
        </div>
        <button id="downloadPDF" class="primary" type="button">Download PDF</button>
        <p id="message"></p>
    </section>

</main>

<script src="script.js"></script>
</body>
</html>
